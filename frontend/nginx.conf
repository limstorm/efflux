# 限流区（conf.d 里的文件会被 include 进 http 块）
limit_req_zone $binary_remote_addr zone=efflux_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=efflux_login:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=efflux_conn:10m;

server {
    listen 80;
    server_name _;

    # 不对外暴露版本号
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 视频不设大小上限（0 = 不限）。图片与音频的限额由后端守着
    client_max_body_size 0;
    client_body_timeout 600s;
    client_body_buffer_size 1m;

    # ---- 基础安全响应头（location 里不再写 add_header，避免覆盖这里）----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 内部鉴权端点：交给后端判断这个请求带没带有效会话
    location = /_auth {
        internal;
        proxy_pass http://backend:8080/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # 登录：单独严格限流，挡住暴力尝试
    location = /api/auth/login {
        limit_req zone=efflux_login burst=5 nodelay;
        limit_conn efflux_conn 10;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（鉴权由后端中间件负责）
    location /api/ {
        limit_req zone=efflux_api burst=60 nodelay;
        limit_conn efflux_conn 30;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传边收边转，不在 Nginx 落盘
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 媒体文件：先过鉴权，再由 Nginx 直接读盘（延迟最低）
    location /files/ {
        auth_request /_auth;
        alias /data/media/;
        expires 1y;
        access_log off;
        autoindex off;
    }

    # 带 hash 的静态资源：长缓存
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 1y;
        access_log off;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
