<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    流光 · 一颗流星
    背景透明：标签栏是纸色还是夜色，这颗都落得下去。
    形状只有三笔——一条从亮到无的尾迹、尾迹尽头那颗亮核、核外一层很淡的光晕。
    16px 下读作一颗暖色的亮点，放大才看出它正带着一条尾巴往下落。

    位图由本文件光栅化导出（浏览器 canvas，底色之外保持透明）：
      icon-192.png / icon-512.png（manifest，512 那份兼作 maskable）/ apple-touch-icon.png 180×180
      favicon.ico（16 / 32 / 48 三档，给不认 SVG 图标的旧浏览器）
    图形落在中心 80% 的安全区里（约 4~26 之间），被系统裁成圆形也不缺角。

    尾迹是沿一条二次贝塞尔采样、按宽度递减偏移出来的闭合轮廓，
    再用 Catmull-Rom 转成三次曲线。改形状请重算这条路径，不要手改其中的点。
  -->
  <defs>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="10.4" y1="22.2" x2="25.6" y2="4.0">
      <stop offset="0" stop-color="#eaa847" />
      <stop offset="0.35" stop-color="#e6a03c" stop-opacity="0.78" />
      <stop offset="0.7" stop-color="#d98d2c" stop-opacity="0.34" />
      <stop offset="1" stop-color="#d98d2c" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.82">
      <stop offset="0" stop-color="#fffaf0" />
      <stop offset="0.42" stop-color="#f8d89e" />
      <stop offset="0.8" stop-color="#eeae4e" />
      <stop offset="1" stop-color="#d2852a" />
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#f0b458" stop-opacity="0.42" />
      <stop offset="0.55" stop-color="#e8a33c" stop-opacity="0.14" />
      <stop offset="1" stop-color="#e8a33c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="10.4" cy="22.2" r="6.6" fill="url(#halo)" />
  <path
    d="M 7.29 20.38 C 7.47 20.18 7.99 19.58 8.35 19.18 C 8.70 18.79 9.06 18.40 9.42 18.01 C 9.78 17.63 10.14 17.24 10.50 16.87 C 10.86 16.49 11.23 16.12 11.60 15.75 C 11.96 15.38 12.33 15.01 12.71 14.65 C 13.08 14.29 13.45 13.94 13.83 13.59 C 14.21 13.23 14.58 12.89 14.96 12.54 C 15.34 12.20 15.73 11.86 16.11 11.52 C 16.49 11.19 16.88 10.85 17.27 10.52 C 17.66 10.19 18.05 9.87 18.44 9.55 C 18.83 9.23 19.22 8.91 19.61 8.59 C 20.01 8.27 20.40 7.96 20.80 7.65 C 21.20 7.34 21.60 7.03 22.00 6.73 C 22.40 6.42 22.80 6.12 23.20 5.82 C 23.60 5.52 24.00 5.22 24.40 4.91 C 24.80 4.61 25.58 3.98 25.60 4.00 C 25.62 4.02 24.88 4.70 24.54 5.06 C 24.19 5.42 23.86 5.80 23.53 6.17 C 23.20 6.55 22.88 6.93 22.57 7.32 C 22.25 7.70 21.95 8.09 21.65 8.49 C 21.35 8.88 21.05 9.28 20.77 9.68 C 20.48 10.09 20.20 10.49 19.92 10.90 C 19.65 11.31 19.38 11.72 19.12 12.14 C 18.86 12.55 18.60 12.97 18.35 13.40 C 18.11 13.82 17.86 14.24 17.63 14.67 C 17.39 15.10 17.16 15.53 16.93 15.96 C 16.71 16.40 16.49 16.83 16.27 17.27 C 16.06 17.71 15.85 18.15 15.65 18.59 C 15.45 19.03 15.25 19.48 15.06 19.93 C 14.87 20.38 14.69 20.83 14.51 21.28 C 14.33 21.73 14.16 22.18 13.99 22.64 C 13.83 23.10 13.59 23.79 13.51 24.02 Z"
    fill="url(#trail)"
  />
  <circle cx="10.4" cy="22.2" r="3.6" fill="url(#core)" />
